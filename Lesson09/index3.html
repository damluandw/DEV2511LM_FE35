<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mẹo thuộc Boostrap</title>
    </head>
    <body>
        <!-- 
            // Cú pháp thường dùng của Bootstrap
            systax:
                {tên_thuộc_tính_CSS}-{kích_thước}-{giá_trị}
                + tên_thuộc_tính_CSS: thuộc tính CSS của Bootstrap có thể là viết tắt của thuộc tính CSS
                + kích_thước: xs, sm, md, lg, xl, xxl (có thể có hoặc không)
                + giá_trị: giá trị của thuộc tính CSS (có thể chỉ có 1 vài từ nhất định)
            // Từ khóa đặc biệt
                + row - col: hệ thống lưới (grid system)
                + color: màu sắc (màu sắc cơ bản: primary, success, danger, warning, info, light, dark, white)
                + margin - padding: khoảng cách (kí hiệu: m - margin, p - padding; giá trị: 0-5,auto; ví trị:  t, b, s, e, x, y)
         -->
    </body>
</html>
