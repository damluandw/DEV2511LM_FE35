<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bài tập</title>
    </head>
    <body>
        <script>
        // 1. Viết hàm tính diện tích hình chữ nhật
        // 2. Viết hàm tính phương trình bậc nhất
        // 3. Viết hàm tính tổng các số từ 1 đến n
        // 4. Viết hàm kiểm tra số nguyên tố
        // 5. Viết hàm tính giai thừa
        // 6. Viết hàm tính phương trình bậc hai
        // Các giá trị trên nhập từ bàn phím hoặc tham số truyền vào hàm
        
        function tinhDienTichHCN(chieuDai, chieuRong) {
            return chieuDai * chieuRong;
        }
        console.log(tinhDienTichHCN(2,3)); // 6
        document.write(tinhDienTichHCN(7,3) + '<br>'); 
        var chieudai = parseInt( prompt("Nhập vào chiều dài" )); 
        var chieurong = parseInt(prompt("Nhập vào chiều rộng" ));
        console.log(tinhDienTichHCN(chieudai,chieurong));
    </script>
    </body>
</html>
