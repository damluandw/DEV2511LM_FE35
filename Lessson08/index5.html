
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>List Cart</title>
        <style>
            table {
                width: 80%;
                margin: auto;
                border-collapse: collapse;
            }
            th, td {
                text-align: center;
            }
            .pre, .plus {
                cursor: pointer;
                padding: 5px 10px;
                border: 1px solid #000;
                margin: 0 5px;
            }
        </style>
    </head>
    <body>
        <section>
            <h1>Giỏ hàng của bạn</h1>
            <table border="1" cellpadding="10" cellspacing="0">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="cart-items">
                    <!-- Cart items will be dynamically inserted here -->

                        <td></td>

                        <td><button>xóa</button></td>
                    </tr> -->
                </tbody>
            </table>
        </section>
        <script src="js/jquery-3.7.1.min.js"></script>
        <script>
            var cart = [];
            function loadCart() {
                cart = localStorage.getItem('cart');
                if (cart) {
                    cart =  JSON.parse(cart);
                } else {
                    cart = [];
                }
              
            }   
            loadCart();

            function saveCart() {
                localStorage.setItem('cart', JSON.stringify(cart));
            }

            function renderCart(item) {
                var temp = `<tr >
                        <td>${item.product.title}</td>
                        <td>${item.product.price}</td>
                        <td> 
                            <span  onclick="updateCart('pre',${item.product.id})" class="pre">-</span>
                            <span data-id='${item.product.id}' class="show-quantity">${item.quantity}</span>
                            <span onclick="updateCart('plus',${item.product.id})" class="plus">+</span> 
                        </td>
                        <td>${parseFloat( item.product.price) * parseFloat(item.quantity)}</td>
                        <td> <button onclick="updateCart('del',${item.product.id})">xóa</button></td>
                    </tr>`;
                return temp;
            }

            function displayCart() {
                $('#cart-items').empty();                
                for (var i = 0; i < cart.length; i++) {
                   $('#cart-items').append(renderCart(cart[i]));
                }
            }
            displayCart();

            // xử lý sự kiện tăng giảm số lượng và xóa sản phẩm
            var idCart = [];
            var index =-1;
            function updateCart(action,idProduct){       
                var quantity;
                // console.log(cart);
                for ( let i = 0 ; i<cart.length ; i++){
                    if (cart[i].product.id === idProduct) {
                        index = i;                        
                    }
                } 
                if(action=="pre"){                    
                    // var qty = cart[index].quantity -1;   
                    if(cart[index].quantity > 1)                     
                        cart[index].quantity--;
                }else if(action=="plus"){
                    cart[index].quantity++;
                }else if(action=="del"){
                    cart.splice(index,1);
                }

                //             if (cart[i].quantity > 1){

                //         if (cart[i].product.id === idProduct) {
                //             ++cart[i].quantity;
                //            quantity = cart[i].quantity;
                //         }
                //     }
                // }
                //  saveCart();
                //  console.log(this);

                saveCart();
                // var dataid = '[data-id="'+ idProduct + '"]';
                // console.log( $(dataid).next('.show-quantity'));

                displayCart();
            }
